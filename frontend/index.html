<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#f7f5f1" />
  <title>Gestionale Bilanci — Analisi di bilancio</title>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("gb.theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/print.css" />
</head>

      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <button class="theme-toggle" id="theme-btn" type="button"><span class="nav-icon">🌓</span><span class="theme-toggle-label" id="theme-label">Tema</span><span class="theme-toggle-pill"></span></button>
    <div class="sidebar-footer"><span class="conn-dot" id="conn"></span><span id="conn-t">Database connesso</span></div>
  </aside>

  <div class="main">
    <header class="topbar">
