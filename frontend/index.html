      (function () {
        var t = null;
        try {
          t = localStorage.getItem("gb.theme");
        } catch (e) {}
        if (t !== "dark" && t !== "light")
          t =
            window.matchMedia &&
            matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", t);
      })();
